name: Check Listening Lab
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check diagnostics.js
      - name: Validate manifest and app assets
        run: |
          node -e "const fs=require('fs');JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));for(const f of ['index.html','app.js','sw.js','safe-area.css','diagnostics.js','icon.svg'])if(!fs.existsSync(f))throw Error('Missing '+f);"
